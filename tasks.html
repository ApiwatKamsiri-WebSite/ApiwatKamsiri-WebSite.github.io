<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Timeline · Apiwat Kamsiri</title>
  <meta name="theme-color" content="#05070b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=20261021l">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2305070b'/><text x='5' y='22' font-family='monospace' font-size='16' font-weight='bold' fill='%2336f1a0'>&gt;_</text></svg>">
</head>
<body>

<div class="bg" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<nav>
  <div class="wrap">
    <div class="nav-pill">
      <a class="brand back-link" href="index.html#tasks">~/<b>apiwat</b></a>
      <a class="lnk back-link" href="index.html#tasks" data-i18n="g.back"></a>
      <div class="lang-switch" role="group" data-i18n-label="lang.switch"><button class="lang-btn" data-lang="en" type="button">EN</button><button class="lang-btn" data-lang="th" type="button">TH</button></div>
    </div>
  </div>
</nav>

<main>
  <section class="page-top">
    <div class="wrap wide">
      <div class="sec-head">
        <div class="eyebrow">gantt --all --expand</div>
        <h2 data-i18n="g.title"></h2>
      </div>

      <div class="g-toolbar">
        <div class="seg" id="zoom" role="group">
          <button class="seg-btn" data-z="week" data-i18n="g.week"></button>
          <button class="seg-btn on" data-z="month" data-i18n="g.month"></button>
          <button class="seg-btn" data-z="half" data-i18n="g.half"></button>
          <button class="seg-btn" data-z="year" data-i18n="g.year"></button>
        </div>
        <button class="btn sm" id="g-today" data-i18n="g.today"></button>
        <button class="btn sm" id="g-expand" data-i18n="g.expand"></button>
        <button class="btn sm" id="g-collapse" data-i18n="g.collapse"></button>
        <button class="btn sm toggle" id="g-hide"></button>
        <span class="grow"></span>
        <button class="btn sm" id="holidays-btn" data-i18n="hol.btn"></button>
        <button class="btn sm primary edit-only" id="add-task" data-i18n="edit.add"></button>
        <button class="btn sm" id="edit-toggle"></button>
        <button class="icon-btn sm edit-only" id="forget-token" type="button" data-i18n-label="edit.forget" title=""><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 9.3-9.3M17 6l3 3M14 9l2 2"/></svg></button>
      </div>

      <div class="card gantt">
        <div class="g-scroll" id="g-scroll"><div class="g-inner" id="gantt"></div></div>
      </div>
    </div>
  </section>
</main>

<footer>
    <div class="wrap wide">
      <span id="foot-date"></span>
      <span id="foot-name">Apiwat Kamsiri</span>
    </div>
  </footer>

<script src="assets/data.js?v=20261021l"></script>
<script src="assets/i18n.js?v=20261021l"></script>
<script src="assets/tasks-store.js?v=20261021l"></script>
<script src="assets/task-editor.js?v=20261021l"></script>
<script src="assets/gantt.js?v=20261021l"></script>
</body>
</html>
